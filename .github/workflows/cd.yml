# Pipeline de Integração Contínua (CI).
# Propósito: executar os testes unitários (Vitest) a cada push na branch main.
# A estrutura está preparada para expansão futura (novos jobs, triggers e variáveis).

name: Continuous Deployment

# Gatilhos do workflow
on:
  push:
    branches:
      - TrabalhandoWorkers

# Variáveis globais disponíveis para todos os jobs
env:
  NODE_VERSION: "24"
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: andre-8f84

jobs:
  # Job de testes unitários
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Checkout
        uses: actions/checkout@v6.1.0

      # Configura o Node.js na versão definida em NODE_VERSION
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # Executa os testes unitários (vitest run)
      - name: Run unit tests
        run: yarn test

  # Job de build e deploy de preview na Vercel (só roda se os testes passarem)
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      - name: Deploy Preview Vercel
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          TESTDINO_TOKEN: ${{ secrets.TESTDINO }}

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Promote to Production
    needs: [e2e-tests, build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Vercel promote
        run: |
          npx vercel@latest promote "${{ needs.build-and-deploy.outputs.deployment-url }}" \
            --token=$VERCEL_TOKEN \
            --scope=$VERCEL_SCOPE \
            --yes
